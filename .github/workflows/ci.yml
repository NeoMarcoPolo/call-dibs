name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # Ubuntu 26.04 runners ship nothing older than 3.10; macOS and
          # Windows still cover the 3.9 floor.
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v tests
      - run: pip install . && dibs --version
